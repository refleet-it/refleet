; OPcache Production Configuration
; Optimized for Symfony + FrankenPHP Worker Mode

; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory settings
opcache.memory_consumption=256
opcache.interned_strings_buffer=16

; File settings
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10

; Validation (disabled for maximum performance in production)
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Optimization settings
opcache.save_comments=1
opcache.enable_file_override=1
opcache.fast_shutdown=1

; Advanced optimizations
opcache.huge_code_pages=1

; JIT - tracing mode gives best results for mixed web workloads (PHP 8.0+)
; 64M buffer is sufficient for Symfony; adjust via env if needed
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Preload Symfony container
opcache.preload=/app/config/preload.php
opcache.preload_user=appuser
