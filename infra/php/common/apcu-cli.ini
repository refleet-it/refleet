; Console commands cache too — Doctrine writes class metadata on every schema:validate,
; migration and cache:warmup. With APCu off under CLI those writes all fail, and Symfony
; reports each one, burying real output under "Failed to save key ... CLASSMETADATA".
;
; Set here rather than per profile so a stage that ships no apcu.ini of its own (ci) does
; not quietly inherit PHP's default of 0.
apc.enable_cli=1
