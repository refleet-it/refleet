# Publishes what a self-hoster consumes: the three container images, and the runner on npm.
# Runs on every push to main — the images are what compose.selfhost.yml pulls, so `latest`
# moving with main is the point. Tagged releases additionally get their tag.
name: Release

on:
    push:
        branches: [main]
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # Production runs on Hetzner's Ampere machines and a good share of developers are on
    # Apple Silicon, so amd64-only images are unusable for both. Each architecture is built
    # on a runner of its own kind rather than under emulation — the backend compiles PHP
    # extensions and the frontend prerenders an Angular build, and QEMU turns both from
    # minutes into the better part of an hour. Public repositories get the arm64 runners free.
    build:
        name: ${{ matrix.image }} (${{ matrix.arch }})
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: [backend, frontend, runner]
                arch: [amd64, arm64]
        steps:
            -   uses: actions/checkout@v5

            -   id: cfg
                name: Resolve what this image is built from
                run: |
                    case "${{ matrix.image }}" in
                        backend)
                            echo "context=." >> "$GITHUB_OUTPUT"
                            echo "file=backend/Dockerfile" >> "$GITHUB_OUTPUT"
                            echo "target=prod" >> "$GITHUB_OUTPUT"
                            echo "build_args=" >> "$GITHUB_OUTPUT"
                            ;;
                        frontend)
                            # From the repository root, not frontend/: the image renders docs/
                            # into the pages served at /docs.
                            echo "context=." >> "$GITHUB_OUTPUT"
                            echo "file=frontend/Dockerfile.ssr" >> "$GITHUB_OUTPUT"
                            echo "target=" >> "$GITHUB_OUTPUT"
                            echo "build_args=BUILD_HASH=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                            ;;
                        runner)
                            # Stamps the version the npm job publishes, so a runner built from
                            # this commit reports it on every heartbeat.
                            echo "context=runner/agent" >> "$GITHUB_OUTPUT"
                            echo "file=runner/agent/Dockerfile" >> "$GITHUB_OUTPUT"
                            echo "target=" >> "$GITHUB_OUTPUT"
                            echo "build_args=RUNNER_VERSION_PATCH=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
                            ;;
                    esac

            -   uses: docker/setup-buildx-action@v3

            -   uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   id: build
                uses: docker/build-push-action@v6
                with:
                    context: ${{ steps.cfg.outputs.context }}
                    file: ${{ steps.cfg.outputs.file }}
                    target: ${{ steps.cfg.outputs.target }}
                    build-args: ${{ steps.cfg.outputs.build_args }}
                    platforms: linux/${{ matrix.arch }}
                    # Pushed by digest only; the merge job below is what gives these a tag.
                    # Two jobs pushing the same tag would each overwrite the other's manifest.
                    outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/refleet-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
                    cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

            -   name: Hand the digest to the merge job
                run: |
                    mkdir -p /tmp/digests
                    # The bare hex, not the sha256: form — artifact paths cannot contain a
                    # colon. The merge job puts the prefix back.
                    digest='${{ steps.build.outputs.digest }}'
                    touch "/tmp/digests/${digest#sha256:}"

            -   uses: actions/upload-artifact@v4
                with:
                    name: digest-${{ matrix.image }}-${{ matrix.arch }}
                    path: /tmp/digests/*
                    retention-days: 1

    # Joins the per-architecture images into one tagged manifest list, so `docker pull`
    # picks the right one and nobody has to think about it.
    images:
        name: ${{ matrix.image }} manifest
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: [backend, frontend, runner]
        steps:
            -   uses: actions/download-artifact@v4
                with:
                    pattern: digest-${{ matrix.image }}-*
                    merge-multiple: true
                    path: /tmp/digests

            -   uses: docker/setup-buildx-action@v3

            -   uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ghcr.io/${{ github.repository_owner }}/refleet-${{ matrix.image }}
                    tags: |
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha,format=long
                        type=ref,event=tag

            -   name: Create the manifest list
                working-directory: /tmp/digests
                run: |
                    docker buildx imagetools create \
                        $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                        $(printf 'ghcr.io/${{ github.repository_owner }}/refleet-${{ matrix.image }}@sha256:%s ' *)

            -   name: Show what landed
                run: |
                    docker buildx imagetools inspect \
                        ghcr.io/${{ github.repository_owner }}/refleet-${{ matrix.image }}:${{ steps.meta.outputs.version }}

    npm:
        name: npm
        runs-on: ubuntu-latest
        # Only from main: a tag build would republish a version that already exists.
        if: github.ref == 'refs/heads/main'
        defaults:
            run:
                working-directory: runner/agent
        steps:
            -   uses: actions/checkout@v5
            -   uses: actions/setup-node@v5
                with:
                    node-version: 22
                    registry-url: https://registry.npmjs.org

            -   run: npm ci --no-audit
            -   run: npm test

            -   name: Stamp the version
                # <major>.<minor> from package.json with this run's number as the patch, so
                # every push to main that touches the runner ships a strictly increasing
                # version without anyone editing package.json. Bump the minor there to open a
                # new series.
                run: |
                    BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
                    npm version --no-git-tag-version "${BASE}.${{ github.run_number }}"

            -   name: Publish if that version is new
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                run: |
                    if [ -z "${NODE_AUTH_TOKEN}" ]; then
                        echo "NPM_TOKEN is not set — skipping publish."
                        exit 0
                    fi
                    VERSION=$(node -p "require('./package.json').version")
                    if npm view "@refleet-it/runner@${VERSION}" version >/dev/null 2>&1; then
                        echo "@refleet-it/runner@${VERSION} is already published."
                        exit 0
                    fi
                    npm publish --access public
