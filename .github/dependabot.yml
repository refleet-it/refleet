# Four dependency trees, one schedule, and grouped updates — a solo project drowns in the
# default one-PR-per-package behaviour, and a wall of PRs gets ignored, which is worse than
# no automation at all. Security updates are exempt from grouping by Dependabot itself and
# still arrive on their own.
version: 2
updates:
    -   package-ecosystem: composer
        directory: /backend
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        groups:
            backend:
                patterns: ['*']
                update-types: [minor, patch]

    -   package-ecosystem: npm
        directory: /frontend
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        groups:
            frontend:
                patterns: ['*']
                update-types: [minor, patch]

    -   package-ecosystem: npm
        directory: /runner/agent
        schedule:
            interval: weekly
        groups:
            runner:
                patterns: ['*']
                update-types: [minor, patch]

    -   package-ecosystem: npm
        directory: /mcp-server
        schedule:
            interval: weekly
        groups:
            mcp-server:
                patterns: ['*']
                update-types: [minor, patch]

    # The workflows pin actions by tag; this is what notices when a tag moves on.
    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        groups:
            actions:
                patterns: ['*']

    # Base images in the Dockerfiles. The backend pins by digest, so these arrive as digest
    # bumps rather than tag changes.
    -   package-ecosystem: docker
        directories:
            - /backend
            - /frontend
            - /runner/agent
        schedule:
            interval: weekly
        groups:
            images:
                patterns: ['*']
