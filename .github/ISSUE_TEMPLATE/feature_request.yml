name: Feature request
description: Something Refleet should be able to do
labels: ['enhancement']
body:
    -   type: textarea
        id: problem
        attributes:
            label: What are you trying to do?
            description: >
                The situation, not the solution. What does your fleet look like, and what
                does Refleet make hard or impossible right now?
        validations:
            required: true
    -   type: textarea
        id: idea
        attributes:
            label: What did you have in mind?
            description: Optional. If you have a shape in mind, describe it.
    -   type: checkboxes
        id: contribute
        attributes:
            label: Would you want to build it?
            options:
                - label: I would be up for working on this
