<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <h2 class="text-lg font-semibold">{{ context.title }}</h2>
    <p class="text-muted-foreground text-sm">{{ context.description }}</p>
  </div>

  <div class="flex justify-end gap-2">
    <button hlmBtn variant="ghost" type="button" (click)="cancel()">
      {{ context.cancelLabel ?? 'Cancel' }}
    </button>
    <button
      hlmBtn
      type="button"
      [variant]="context.destructive ? 'destructive' : 'default'"
      (click)="confirm()"
    >
      {{ context.confirmLabel }}
    </button>
  </div>
</div>
