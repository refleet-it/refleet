services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Qualification\:
        resource: '../src/'
        exclude:
            - '../src/Qualification/Infrastructure/Api/'

    App\Qualification\Qualification\Infrastructure\Api\:
        resource: '../src/Qualification/Infrastructure/Api/**/*Controller.php'
        tags: ['controller.service_arguments']

    App\Qualification\Qualification\Infrastructure\Persistence\:
        resource: '../src/Qualification/Infrastructure/Persistence/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.qualification_entity_manager'

    # Port owned by this context, consumed by others through Shared
    App\Shared\Domain\Service\QualifiedProjectsInterface:
        alias: App\Qualification\Qualification\Infrastructure\Service\QualifiedProjects

    # HTTP-backed adapter — see App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator.
    App\Shared\Domain\Service\ApiKeyValidatorInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator

    # HTTP-backed adapters — see App\Shared\Infrastructure\Http\Internal\.
    App\Shared\Domain\Service\OrganizationContextProviderInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpOrganizationContextProvider
    App\Shared\Domain\Service\RunnerDirectoryInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpRunnerDirectory
    App\Shared\Domain\Service\ProjectCatalogInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpProjectCatalog
    App\Shared\Domain\Service\UserEmailProviderInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpUserEmailProvider

    # Registers the shared domain-event dispatcher for this context's own connection only —
    # see App\Shared\Application\Event\DomainEventDispatcher.
    App\Shared\Application\Event\DomainEventDispatcher:
        tags:
            - { name: 'doctrine.event_listener', event: 'preFlush', connection: 'qualification', priority: 500 }
