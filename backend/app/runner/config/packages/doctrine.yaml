# The runner context owns one connection and one entity manager. They live here so the
# application that serves this context declares its own database wiring instead of
# inheriting all eight — see docs/adr/0001-multiple-kernels.md.
doctrine:
    dbal:
        connections:
            runner:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: false
                schema_filter: ~^(runner\.|public\.doctrine_migration_versions)~
                options:
                    1002: "SET search_path TO runner, public"
    orm:
        default_entity_manager: runner
        entity_managers:
            runner:
                connection: runner
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                metadata_cache_driver:
                    type: pool
                    pool: cache.app
                mappings:
                    Runner:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/app/runner/src'
                        prefix: 'App\Runner'
                        alias: Runner

when@test:
    doctrine:
        dbal:
            connections:
                runner:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
