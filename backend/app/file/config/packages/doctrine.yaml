# The file context owns one connection and one entity manager. They live here so the
# application that serves this context declares its own database wiring instead of
# inheriting all eight — see docs/adr/0001-multiple-kernels.md.
doctrine:
    dbal:
        connections:
            file:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: false
                schema_filter: ~^(file\.|public\.doctrine_migration_versions)~
                options:
                    1002: "SET search_path TO file, public"
    orm:
        default_entity_manager: file
        entity_managers:
            file:
                connection: file
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                metadata_cache_driver:
                    type: pool
                    pool: cache.app
                mappings:
                    File:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/app/file/src'
                        prefix: 'App\File'
                        alias: File

when@test:
    doctrine:
        dbal:
            connections:
                file:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
