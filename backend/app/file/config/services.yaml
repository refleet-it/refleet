services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\File\:
        resource: '../src/'
        exclude:
            - '../src/File/Infrastructure/Api/'

    App\File\File\Infrastructure\Api\:
        resource: '../src/File/Infrastructure/Api/**/*Controller.php'
        tags: ['controller.service_arguments']

    App\File\File\Infrastructure\Persistence\:
        resource: '../src/File/Infrastructure/Persistence/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.file_entity_manager'

    # Local filesystem storage (uploads volume mounted at /app/public/uploads).
    App\File\File\Domain\Service\FileStorageServiceInterface:
        alias: App\File\File\Infrastructure\Service\FileStorageService

    App\File\File\Domain\Service\WebPImageStorageServiceInterface:
        alias: App\File\File\Infrastructure\Service\FileStorageService

    # Port owned by this context, consumed by others through Shared
    App\Shared\Domain\Service\StorageAvailabilityCheckerInterface:
        alias: App\File\File\Infrastructure\Service\FileStorageService

    # HTTP-backed adapter — see App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator.
    App\Shared\Domain\Service\ApiKeyValidatorInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator

    # Registers the shared domain-event dispatcher for this context's own connection only —
    # see App\Shared\Application\Event\DomainEventDispatcher.
    App\Shared\Application\Event\DomainEventDispatcher:
        tags:
            - { name: 'doctrine.event_listener', event: 'preFlush', connection: 'file', priority: 500 }
