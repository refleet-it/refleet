# The GitLab instance the OAuth handshake runs against (see
# App\Organization\GitLabConnection\Infrastructure\Service\GitLabOAuthClient). Point it at a
# self-managed GitLab to connect one through OAuth rather than a pasted token.
parameters:
    env(GITLAB_OAUTH_BASE_URL): 'https://gitlab.com'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Organization\:
        resource: '../src/'
        exclude:
            - '../src/Organization/Infrastructure/Api/'
            - '../src/GitLabConnection/Infrastructure/Api/'

    App\Organization\Organization\Infrastructure\Api\:
        resource: '../src/Organization/Infrastructure/Api/**/*Controller.php'
        tags: ['controller.service_arguments']

    App\Organization\GitLabConnection\Infrastructure\Api\:
        resource: '../src/GitLabConnection/Infrastructure/Api/**/*Controller.php'
        tags: ['controller.service_arguments']

    App\Organization\Organization\Infrastructure\Persistence\:
        resource: '../src/Organization/Infrastructure/Persistence/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.organization_entity_manager'

    App\Organization\GitLabConnection\Infrastructure\Persistence\:
        resource: '../src/GitLabConnection/Infrastructure/Persistence/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.organization_entity_manager'

    # Ports owned by this context, consumed by others through Shared
    App\Shared\Domain\Service\OrganizationContextProviderInterface:
        alias: App\Organization\Organization\Infrastructure\Service\OrganizationContextProvider

    App\Shared\Domain\Service\GitLabWebhookSecretProviderInterface:
        alias: App\Organization\GitLabConnection\Infrastructure\Service\GitLabWebhookSecretProvider

    # HTTP-backed adapter — see App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator.
    App\Shared\Domain\Service\ApiKeyValidatorInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpApiKeyValidator

    # HTTP-backed adapters — see App\Shared\Infrastructure\Http\Internal\.
    App\Shared\Domain\Service\ProjectRegistryInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpProjectRegistry
    App\Shared\Domain\Service\TemplateEmailSenderInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpTemplateEmailSender
    App\Shared\Domain\Service\InvitedAccountRegistrarInterface:
        alias: App\Shared\Infrastructure\Http\Internal\HttpInvitedAccountRegistrar

    # Registers the shared domain-event dispatcher for this context's own connection only —
    # see App\Shared\Application\Event\DomainEventDispatcher.
    App\Shared\Application\Event\DomainEventDispatcher:
        tags:
            - { name: 'doctrine.event_listener', event: 'preFlush', connection: 'organization', priority: 500 }
