organization:
    resource: ../src/Organization/Infrastructure/Api/
    type: attribute
    prefix: /api
    defaults:
        _format: json

gitlab_connection:
    resource: ../src/GitLabConnection/Infrastructure/Api/
    type: attribute
    prefix: /api
    defaults:
        _format: json

# Container-to-container only, gated by the `internal` firewall — see
# App\Shared\Infrastructure\Http\InternalApiClient and docs/adr/0001-multiple-kernels.md.
organization_internal:
    resource: ../src/Organization/Infrastructure/Api/Internal/
    type: attribute
    prefix: /internal
    defaults:
        _format: json

gitlab_connection_internal:
    resource: ../src/GitLabConnection/Infrastructure/Api/Internal/
    type: attribute
    prefix: /internal
    defaults:
        _format: json
