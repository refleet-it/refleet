# The project context owns one connection and one entity manager. They live here so the
# application that serves this context declares its own database wiring instead of
# inheriting all eight — see docs/adr/0001-multiple-kernels.md.
doctrine:
    dbal:
        connections:
            project:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: false
                schema_filter: ~^(project\.|public\.doctrine_migration_versions)~
                options:
                    1002: "SET search_path TO project, public"
    orm:
        default_entity_manager: project
        entity_managers:
            project:
                connection: project
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                metadata_cache_driver:
                    type: pool
                    pool: cache.app
                mappings:
                    Project:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/app/project/src'
                        prefix: 'App\Project'
                        alias: Project

when@test:
    doctrine:
        dbal:
            connections:
                project:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
