# The shift context owns one connection and one entity manager. They live here so the
# application that serves this context declares its own database wiring instead of
# inheriting all eight — see docs/adr/0001-multiple-kernels.md.
doctrine:
    dbal:
        connections:
            shift:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: false
                schema_filter: ~^(shift\.|public\.doctrine_migration_versions)~
                options:
                    1002: "SET search_path TO shift, public"
    orm:
        default_entity_manager: shift
        entity_managers:
            shift:
                connection: shift
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                metadata_cache_driver:
                    type: pool
                    pool: cache.app
                mappings:
                    Shift:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/app/shift/src'
                        prefix: 'App\Shift'
                        alias: Shift


when@test:
    doctrine:
        dbal:
            connections:
                shift:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
