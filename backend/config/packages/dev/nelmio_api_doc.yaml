nelmio_api_doc:
    documentation:
        info:
            title: 'Refleet API'
            description: 'Backend API for Refleet, with enhanced security, monitoring, and performance optimizations'
            version: '1.0.0'
        servers:
            - url: 'http://localhost'
              description: 'This instance'
        components:
            securitySchemes:
                bearerAuth:
                    type: 'http'
                    scheme: 'bearer'
                    bearerFormat: 'JWT'
    areas:
        default:
            path_patterns: ['^/api(?!/storage)']